<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistencia de brigadas</title>
<style>
  :root { --bg: #f4f1ea; --card: #fffdf8; --texto: #1d1b18; --suave: #7a736a; --si: #2f9e5b; --no: #d4553f; --acento: #3b5bdb; --borde: #e2dccf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16161a; --card: #22222a; --texto: #f1efe9; --suave: #9a958c; --si: #36b96c; --no: #ef6b55; --acento: #7c95ff; --borde: #34343e; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #16161a; --card: #22222a; --texto: #f1efe9; --suave: #9a958c; --si: #36b96c; --no: #ef6b55; --acento: #7c95ff; --borde: #34343e; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--texto); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; }
  h1 { font-size: 20px; margin: 0; }
  main { padding: 0 16px 24px; max-width: 480px; margin: 0 auto; }
  input, select { font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--borde); border-radius: 10px; background: var(--card); color: var(--texto); min-height: 44px; min-width: 0; }
  select { flex: 1; }
  .barra { display: flex; gap: 8px; margin-bottom: 8px; }
  .estado-dia { color: var(--suave); font-size: 14px; margin: 4px 0 16px; }
  .mazo { position: relative; height: 340px; margin-bottom: 16px; }
  .tarjeta { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; padding: 24px; border-radius: 20px; background: var(--card); border: 1px solid var(--borde); box-shadow: 0 8px 24px rgb(0 0 0 / .12); touch-action: pan-y; user-select: none; cursor: grab; text-align: center; }
  .tarjeta .nombre { font-size: 26px; font-weight: 700; text-wrap: balance; }
  .tarjeta .meta { color: var(--suave); }
  .sello { position: absolute; top: 20px; font-size: 22px; font-weight: 800; letter-spacing: .05em; padding: 4px 10px; border: 3px solid; border-radius: 8px; opacity: 0; }
  .sello.si { left: 20px; color: var(--si); border-color: var(--si); transform: rotate(-12deg); }
  .sello.no { right: 20px; color: var(--no); border-color: var(--no); transform: rotate(12deg); }
  .acciones { display: flex; justify-content: center; gap: 16px; }
  .acciones button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--borde); background: var(--card); font-size: 26px; cursor: pointer; color: var(--texto); }
  .acciones .no { color: var(--no); }
  .acciones .si { color: var(--si); }
  .acciones .deshacer { width: 48px; height: 48px; font-size: 20px; align-self: center; color: var(--suave); }
  .fin { text-align: center; padding: 32px 8px; }
  .fin p { color: var(--suave); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; margin: 6px; border-radius: 12px; border: 0; background: var(--acento); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.secundario { background: var(--card); color: var(--texto); border: 1px solid var(--borde); }
  details { margin-top: 20px; }
  summary { color: var(--suave); cursor: pointer; padding: 8px 0; }
  .lista { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
  .fila { width: 100%; display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 10px; background: var(--card); color: var(--texto); font: inherit; text-align: left; cursor: pointer; }
  .fila small { color: var(--suave); }
  #estado { color: var(--suave); font-size: 14px; min-height: 20px; margin-top: 8px; }
  textarea { width: 100%; min-height: 120px; font: 13px ui-monospace, monospace; margin-top: 8px; background: var(--card); color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; padding: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Asistencia de brigadas</h1>
  <input type="date" id="fecha" aria-label="Fecha de asistencia">
</header>

<main>
  <div class="barra">
    <select id="comando" aria-label="Comando"></select>
    <select id="brigada" aria-label="Brigada"></select>
  </div>
  <p class="estado-dia" id="resumen"></p>

  <section id="mazo-sec">
    <div class="mazo" id="mazo">
      <div class="tarjeta" id="tarjeta">
        <span class="sello si">ASISTIÓ</span>
        <span class="sello no">FALTA</span>
        <div class="nombre" id="nombre"></div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div class="acciones">
      <button class="no" id="btn-no" aria-label="No asistió">✗</button>
      <button class="deshacer" id="deshacer" aria-label="Deshacer">↶</button>
      <button class="si" id="btn-si" aria-label="Asistió">✔</button>
    </div>
  </section>

  <section class="fin" id="fin" hidden>
    <p id="fin-texto"></p>
    <button class="btn" id="copiar">Copiar para Excel</button>
    <textarea id="texto" hidden readonly></textarea>
  </section>

  <details>
    <summary>Ver y cambiar la lista completa</summary>
    <ul class="lista" id="lista"></ul>
  </details>
  <details>
    <summary>Cambiar por otro Excel</summary>
    <input type="file" id="abrir" accept=".xlsx">
  </details>

  <p id="estado"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
// Lógica del libro de asistencia, sin pantalla: se prueba en Node y se usa en el navegador.
// Libro = { headers: [...], filas: [{ columna: valor }] }. Columnas: Comando, Brigada, Matrícula, Nombre, fechas dd/mm/aaaa..., Total.
var Asistencia = (function () {
  const X = typeof XLSX !== 'undefined' ? XLSX : require('xlsx');
  const BASE = ['Comando', 'Brigada', 'Matrícula', 'Nombre'];
  const TOTAL = 'Total';
  // shortcut: la marca es el texto ✔ y no una casilla de formulario de Excel (SheetJS no las escribe), subir a casilla real con un editor de .xlsx que las soporte
  const MARCA = '✔';
  const FALTA = '✗';
  const esFecha = h => /^\d{2}\/\d{2}\/\d{4}$/.test(h);
  const aOrden = f => f.slice(6) + f.slice(3, 5) + f.slice(0, 2); // dd/mm/aaaa -> aaaammdd

  // Excel convierte "20/10/2026" en fecha real al escribirlo en el encabezado: vuelve a texto dd/mm/aaaa.
  function encabezado(h) {
    if (typeof h !== 'number') return String(h).trim();
    const f = X.SSF.parse_date_code(h);
    return `${String(f.d).padStart(2, '0')}/${String(f.m).padStart(2, '0')}/${f.y}`;
  }

  // Columnas base primero, luego las extra del usuario, luego fechas en orden y Total al final.
  function ordenarColumnas(headers) {
    const fechas = headers.filter(esFecha).sort((a, b) => aOrden(a).localeCompare(aOrden(b)));
    return [...headers.filter(h => !esFecha(h) && h !== TOTAL), ...fechas, TOTAL];
  }

  function leer(bytes) {
    const wb = X.read(bytes, { type: 'array' });
    const aoa = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    const headers = ordenarColumnas(aoa[0].map(encabezado));
    if (BASE.some((h, i) => headers[i] !== h)) throw new Error('El Excel debe tener estas columnas al inicio: ' + BASE.join(', '));
    const filas = aoa.slice(1).filter(r => r.some(v => v !== '')).map(r => {
      const f = {};
      headers.forEach((h, i) => { f[h] = BASE.includes(h) ? String(r[i]).trim() : r[i]; });
      return f;
    });
    return { headers, filas };
  }

  // Inserta la columna de la fecha en orden cronológico, antes de Total.
  function asegurarFecha(libro, fecha) {
    if (libro.headers.includes(fecha)) return;
    libro.headers = ordenarColumnas([...libro.headers, fecha]);
    libro.filas.forEach(f => { f[fecha] = ''; });
  }

  // valor: MARCA (asistió), FALTA (no asistió) o '' (sin marcar).
  function marcar(fila, fecha, valor) {
    fila[fecha] = valor;
  }

  function contar(fila, fechas) {
    return fechas.filter(d => fila[d] === MARCA).length;
  }

  // Ordena por comando, brigada y nombre, para que la hoja quede clasificada.
  function ordenar(libro) {
    libro.filas.sort((a, b) => a.Comando.localeCompare(b.Comando, 'es') ||
      a.Brigada.localeCompare(b.Brigada, 'es') || a.Nombre.localeCompare(b.Nombre, 'es'));
  }

  // Total por alumno como fórmula, así Excel lo recalcula si editas a mano.
  function aBytes(libro) {
    ordenar(libro);
    const ws = X.utils.json_to_sheet(libro.filas, { header: libro.headers });
    const fechas = libro.headers.filter(esFecha);
    const colTotal = libro.headers.length - 1;
    const colIni = libro.headers.findIndex(esFecha);
    libro.filas.forEach((f, i) => {
      const dir = X.utils.encode_cell({ r: i + 1, c: colTotal });
      const v = contar(f, fechas); // valor en caché, para vistas previas sin recalcular
      ws[dir] = { t: 'n', v };
      if (fechas.length) ws[dir].f = `COUNTIF(${X.utils.encode_col(colIni)}${i + 2}:${X.utils.encode_col(colTotal - 1)}${i + 2},"${MARCA}")`;
    });
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Asistencia');
    return X.write(wb, { type: 'array', bookType: 'xlsx' });
  }

  // Plantilla con un alumno de ejemplo para que veas el formato.
  function plantilla() {
    const libro = { headers: [...BASE, TOTAL], filas: [{ Comando: 'Comando 1', Brigada: 'Brigada A', 'Matrícula': '001', Nombre: 'Alumno ejemplo', Total: '' }] };
    return aBytes(libro);
  }

  // Texto con tabulaciones: se pega directo en Excel. El Total va calculado.
  function aTexto(libro) {
    ordenar(libro);
    const fechas = libro.headers.filter(esFecha);
    const celda = (f, h) => (h === TOTAL ? contar(f, fechas) : f[h] ?? '');
    return [libro.headers, ...libro.filas.map(f => libro.headers.map(h => celda(f, h)))]
      .map(r => r.join('\t')).join('\n');
  }

  function presentes(libro, fecha, comando, brigada) {
    const filas = libro.filas.filter(f => (!comando || f.Comando === comando) && (!brigada || f.Brigada === brigada));
    return { presentes: filas.filter(f => f[fecha] === MARCA).length, total: filas.length };
  }

  return { MARCA, FALTA, BASE, TOTAL, leer, asegurarFecha, marcar, aBytes, aTexto, plantilla, presentes, esFecha, ordenarColumnas };
})();

if (typeof module !== 'undefined') module.exports = Asistencia;
</script>
<script>
const $ = id => document.getElementById(id);
const aFecha = iso => iso.split('-').reverse().join('/'); // yyyy-mm-dd -> dd/mm/aaaa
const aIso = f => f.split('/').reverse().join('-');
const hoyIso = () => new Date().toLocaleDateString('en-CA');
const el = (tag, texto, clase) => { const e = document.createElement(tag); e.textContent = texto; if (clase) e.className = clase; return e; };
const aviso = msg => { $('estado').textContent = msg; };
const { MARCA, FALTA } = Asistencia;

// Copia del Excel en el navegador para no perder marcas si se cierra la página.
const DB = {
  abrir: () => new Promise((ok, no) => {
    const r = indexedDB.open('asistencia', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  }),
  async get() {
    const db = await this.abrir();
    return new Promise((ok, no) => { const q = db.transaction('kv').objectStore('kv').get('libro'); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); });
  },
  async set(bytes) {
    const db = await this.abrir();
    return new Promise((ok, no) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(bytes, 'libro'); t.oncomplete = ok; t.onerror = () => no(t.error); });
  },
};

let libro = null, fecha = aFecha(hoyIso()), comando = '', brigada = '', ultimo = null;

async function guardar() {
  try {
    await DB.set(Asistencia.aBytes(libro));
  } catch (e) {
    aviso('No se pudo guardar en el teléfono. Copia los datos antes de cerrar.');
  }
}

function alumnosDeBrigada() {
  return libro.filas.filter(f => f.Comando === comando && f.Brigada === brigada);
}

function opciones(select, valores, actual) {
  select.replaceChildren(...valores.map(v => Object.assign(el('option', v), { selected: v === actual })));
}

function pintar() {
  if (!libro) return;
  Asistencia.asegurarFecha(libro, fecha);
  const comandos = [...new Set(libro.filas.map(f => f.Comando))];
  if (!comandos.includes(comando)) comando = comandos[0] || '';
  const brigadas = [...new Set(libro.filas.filter(f => f.Comando === comando).map(f => f.Brigada))];
  if (!brigadas.includes(brigada)) brigada = brigadas[0] || '';
  opciones($('comando'), comandos, comando);
  opciones($('brigada'), brigadas, brigada);
  $('fecha').value = aIso(fecha);
  const b = Asistencia.presentes(libro, fecha, comando, brigada);
  const c = Asistencia.presentes(libro, fecha, comando, '');
  $('resumen').textContent = `Brigada: ${b.presentes} de ${b.total} asistieron · Comando: ${c.presentes} de ${c.total}`;
  pintarMazo();
  pintarLista();
}

// Solo aparecen los alumnos sin marcar; al marcar, la tarjeta se va.
function pintarMazo() {
  const pendiente = alumnosDeBrigada().find(f => f[fecha] === '');
  $('mazo-sec').hidden = !pendiente;
  $('fin').hidden = !!pendiente;
  if (!pendiente) {
    $('fin-texto').textContent = `Brigada ${brigada} completa. Pasa los datos a tu Excel.`;
    return;
  }
  const tarjeta = $('tarjeta');
  tarjeta.style.transition = 'none';
  tarjeta.style.transform = '';
  $('nombre').textContent = pendiente.Nombre;
  $('meta').textContent = `${pendiente.Comando} · ${pendiente.Brigada} · Matrícula ${pendiente['Matrícula']}`;
}

function pintarLista() {
  $('lista').replaceChildren(...alumnosDeBrigada().map(f => {
    const estado = f[fecha] === MARCA ? '✔ asistió' : f[fecha] === FALTA ? '✗ falta' : 'sin marcar';
    const boton = el('button', '', 'fila');
    boton.append(el('b', f.Nombre), el('small', estado));
    boton.onclick = () => marcarAlumno(f, f[fecha] === MARCA ? '' : MARCA);
    const li = el('li', '');
    li.append(boton);
    return li;
  }));
}

function marcarAlumno(fila, valor) {
  ultimo = { fila, fecha, previo: fila[fecha] };
  Asistencia.marcar(fila, fecha, valor);
  guardar();
  pintar();
}

// Deslizar: derecha = asistió, izquierda = falta. Los botones hacen lo mismo.
function decidir(valor) {
  const tarjeta = $('tarjeta');
  const alumno = alumnosDeBrigada().find(f => f[fecha] === '');
  if (!alumno) return;
  tarjeta.style.transition = 'transform .25s, opacity .25s';
  tarjeta.style.transform = `translateX(${valor === MARCA ? 500 : -500}px) rotate(${valor === MARCA ? 20 : -20}deg)`;
  tarjeta.style.opacity = '0';
  setTimeout(() => { tarjeta.style.opacity = '1'; marcarAlumno(alumno, valor); }, 250);
}

function volver() {
  if (!ultimo) return aviso('No hay nada que deshacer.');
  const { fila, fecha: f, previo } = ultimo;
  Asistencia.marcar(fila, f, previo);
  ultimo = null;
  guardar();
  pintar();
}

const tarjeta = $('tarjeta');
let inicioX = null, dx = 0;
tarjeta.onpointerdown = e => { inicioX = e.clientX; dx = 0; tarjeta.setPointerCapture(e.pointerId); tarjeta.style.transition = 'none'; };
tarjeta.onpointermove = e => {
  if (inicioX === null) return;
  dx = e.clientX - inicioX;
  tarjeta.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
  $('tarjeta').querySelector('.si').style.opacity = Math.max(0, dx / 120);
  $('tarjeta').querySelector('.no').style.opacity = Math.max(0, -dx / 120);
};
function soltar() {
  if (inicioX === null) return;
  inicioX = null;
  Array.from(tarjeta.querySelectorAll('.sello')).forEach(s => { s.style.opacity = ''; });
  if (Math.abs(dx) > 90) decidir(dx > 0 ? MARCA : FALTA);
  else { tarjeta.style.transition = 'transform .2s'; tarjeta.style.transform = ''; }
}
tarjeta.onpointerup = soltar;
tarjeta.onpointercancel = soltar;

$('btn-si').onclick = () => decidir(MARCA);
$('btn-no').onclick = () => decidir(FALTA);
$('deshacer').onclick = volver;
$('fecha').onchange = e => { fecha = aFecha(e.target.value); pintar(); };
$('comando').onchange = e => { comando = e.target.value; brigada = ''; pintar(); };
$('brigada').onchange = e => { brigada = e.target.value; pintar(); };

// Copiar: el visor no deja descargar archivos, así que el texto va al portapapeles (Excel lo pega en celdas).
$('copiar').onclick = async () => {
  const texto = Asistencia.aTexto(libro);
  try {
    await navigator.clipboard.writeText(texto);
    aviso('Copiado. En Excel pega con Ctrl+V (o ⌘V) en una celda A1 y guarda el archivo.');
  } catch (e) {
    $('texto').hidden = false;
    $('texto').value = texto;
    $('texto').select();
    aviso('No pude copiar automáticamente. Selecciona el texto de abajo y cópialo.');
  }
};

$('abrir').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    libro = Asistencia.leer(new Uint8Array(await file.arrayBuffer()));
    comando = brigada = '';
    ultimo = null;
    pintar();
    await guardar();
  } catch (err) {
    aviso('No pude abrir ese Excel: ' + err.message);
  }
};

(async () => {
  try {
    const guardado = await DB.get();
    // Sin copia guardada, arranca con los alumnos iniciales.
    libro = guardado ? Asistencia.leer(guardado) : structuredClone(INICIAL);
  } catch (e) {
    libro = structuredClone(INICIAL);
    aviso('No pude leer lo guardado en el teléfono: ' + e.message);
  }
  pintar();
})();
</script>
