# Stack del homelab. Datos en ${DATA_PATH}, configurable en .env
services:
  homepage:            # Dashboard central con todos los servicios
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports: ["3000:3000"]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  portainer:           # Gestión visual de Docker
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports: ["9443:9443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}/portainer:/data
    restart: unless-stopped

  npm:                 # Reverse proxy con certificados HTTPS (Let's Encrypt)
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    ports: ["${NPM_HTTP_PORT:-80}:80", "${NPM_HTTPS_PORT:-443}:443", "81:81"]
    volumes:
      - ${DATA_PATH}/npm/data:/data
      - ${DATA_PATH}/npm/letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  adguard:             # DNS con bloqueo de anuncios para toda la red
    image: adguard/adguardhome:latest
    container_name: adguard
    profiles: [adguard]    # install.sh lo omite si ya hay otro DNS (p. ej. Pi-hole) en el puerto 53
    ports: ["53:53/tcp", "53:53/udp", "8080:80", "3003:3000"]
    volumes:
      - ${DATA_PATH}/adguard/work:/opt/adguardhome/work
      - ${DATA_PATH}/adguard/conf:/opt/adguardhome/conf
    restart: unless-stopped

  uptime-kuma:         # Monitorización y alertas de caídas
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports: ["3001:3001"]
    volumes:
      - ${DATA_PATH}/uptime-kuma:/app/data
    restart: unless-stopped

  jellyfin:            # Servidor multimedia (tu Netflix propio)
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    profiles: [jellyfin]   # install.sh lo omite si ya tienes un Jellyfin
    ports: ["8096:8096"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/jellyfin/config:/config
      - ${DATA_PATH}/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media:ro
    restart: unless-stopped

  vaultwarden:         # Gestor de contraseñas compatible con Bitwarden
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      SIGNUPS_ALLOWED: "true"   # Cambia a false tras crear tu cuenta
    volumes:
      - ${DATA_PATH}/vaultwarden:/data
    restart: unless-stopped

  netdata:             # Métricas en tiempo real del servidor
    image: netdata/netdata:stable
    container_name: netdata
    pid: host
    network_mode: host
    cap_add: [SYS_PTRACE, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    volumes:
      - ${DATA_PATH}/netdata/config:/etc/netdata
      - ${DATA_PATH}/netdata/lib:/var/lib/netdata
      - ${DATA_PATH}/netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  wg-easy:             # VPN WireGuard para entrar a casa desde fuera
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    profiles: [vpn]        # opcional: ENABLE_WG=1 en .env (en kernels sin iptables legacy falla; usa Tailscale)
    environment:
      WG_HOST: ${WG_HOST:-cambia-por-tu-ip-publica-o-ddns}
    ports: ["51820:51820/udp", "51821:51821/tcp"]
    volumes:
      - ${DATA_PATH}/wireguard:/etc/wireguard
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    restart: unless-stopped

  watchtower:          # Actualiza los contenedores automáticamente cada noche
    image: nickfedor/watchtower:latest   # fork mantenido; el original no soporta Docker reciente
    container_name: watchtower
    # Solo actualiza los servicios de este stack, no tus contenedores propios
    command: homepage portainer npm adguard uptime-kuma jellyfin vaultwarden netdata wg-easy watchtower
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
