# Stack del homelab. Datos en ${DATA_PATH}, configurable en .env
services:
  homepage:            # Dashboard central con todos los servicios
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports: ["3000:3000"]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  portainer:           # Gestión visual de Docker
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports: ["9443:9443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}/portainer:/data
    restart: unless-stopped

  npm:                 # Reverse proxy con certificados HTTPS (Let's Encrypt)
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    ports: ["${NPM_HTTP_PORT:-80}:80", "${NPM_HTTPS_PORT:-443}:443", "81:81"]
    volumes:
      - ${DATA_PATH}/npm/data:/data
      - ${DATA_PATH}/npm/letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  adguard:             # DNS con bloqueo de anuncios para toda la red
    image: adguard/adguardhome:latest
    container_name: adguard
    profiles: [adguard]    # install.sh lo omite si ya hay otro DNS (p. ej. Pi-hole) en el puerto 53
    ports: ["53:53/tcp", "53:53/udp", "8080:80", "3003:3000"]
    volumes:
      - ${DATA_PATH}/adguard/work:/opt/adguardhome/work
      - ${DATA_PATH}/adguard/conf:/opt/adguardhome/conf
    restart: unless-stopped

  uptime-kuma:         # Monitorización y alertas de caídas
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports: ["3001:3001"]
    volumes:
      - ${DATA_PATH}/uptime-kuma:/app/data
    restart: unless-stopped

  jellyfin:            # Servidor multimedia (tu Netflix propio)
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    profiles: [jellyfin]   # install.sh lo omite si ya tienes un Jellyfin
    ports: ["8096:8096"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/jellyfin/config:/config
      - ${DATA_PATH}/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media:ro
    restart: unless-stopped

  vaultwarden:         # Gestor de contraseñas compatible con Bitwarden
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      SIGNUPS_ALLOWED: "true"   # Cambia a false tras crear tu cuenta
    volumes:
      - ${DATA_PATH}/vaultwarden:/data
    restart: unless-stopped

  immich-server:       # Fotos y vídeos (alternativa a Google Fotos)
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    container_name: immich_server
    ports: ["2283:2283"]
    environment: &immich-env
      TZ: ${TZ}
      DB_HOSTNAME: immich-database
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - ${PHOTOS_PATH:-/srv/homelab/immich/library}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on: [immich-redis, immich-database]
    restart: unless-stopped

  immich-machine-learning:   # Reconocimiento de caras y búsqueda inteligente
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    container_name: immich_machine_learning
    environment: *immich-env
    volumes:
      - ${DATA_PATH}/immich/model-cache:/cache
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich_redis
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_PATH}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

  homeassistant:       # Domótica: luces, enchufes, sensores, automatizaciones
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host   # necesario para descubrir dispositivos en tu red
    privileged: true
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped

  netdata:             # Métricas en tiempo real del servidor
    image: netdata/netdata:stable
    container_name: netdata
    pid: host
    network_mode: host
    cap_add: [SYS_PTRACE, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    volumes:
      - ${DATA_PATH}/netdata/config:/etc/netdata
      - ${DATA_PATH}/netdata/lib:/var/lib/netdata
      - ${DATA_PATH}/netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  wg-easy:             # VPN WireGuard para entrar a casa desde fuera
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    profiles: [vpn]        # opcional: ENABLE_WG=1 en .env (en kernels sin iptables legacy falla; usa Tailscale)
    environment:
      WG_HOST: ${WG_HOST:-cambia-por-tu-ip-publica-o-ddns}
    ports: ["51820:51820/udp", "51821:51821/tcp"]
    volumes:
      - ${DATA_PATH}/wireguard:/etc/wireguard
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    restart: unless-stopped

  watchtower:          # Actualiza los contenedores automáticamente cada noche
    image: nickfedor/watchtower:latest   # fork mantenido; el original no soporta Docker reciente
    container_name: watchtower
    # Solo actualiza los servicios de este stack, no tus contenedores propios.
    # Immich queda fuera: sus actualizaciones pueden requerir pasos manuales.
    command: homepage portainer npm adguard uptime-kuma jellyfin vaultwarden netdata wg-easy homeassistant watchtower
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
